<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>C#과 KCP로 배우는 실시간 게임 네트워킹</title>
  <meta name="description" content="kcp-csharp 라이브러리로 배우는 실시간 게임 네트워킹 — 원리부터 예측·보정까지">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/themes/vue.css">
  <style>
    :root { --theme-color: #2f6fb0; }
    .markdown-section { max-width: 900px; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section blockquote { border-left: 4px solid var(--theme-color); background: #f6f9fc; }
    .sidebar-nav > ul > li > p { font-weight: 700; color: #444; margin: 1em 0 .4em; }
  </style>
</head>
<body>
  <div id="app">읽어 오는 중…</div>
  <script>
    window.$docsify = {
      name: 'C#과 KCP로 배우는<br>실시간 게임 네트워킹',
      repo: 'jacking75/kcp-csharp',
      loadSidebar: true,
      subMaxLevel: 2,
      maxLevel: 3,
      auto2top: true,
      search: {
        placeholder: '검색',
        noData: '결과가 없습니다.',
        depth: 3,
      },
      pagination: {
        previousText: '이전',
        nextText: '다음',
        crossChapter: true,
      },
      mermaidConfig: { startOnLoad: false },
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-csharp.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
  <script>mermaid.initialize({ startOnLoad: false, theme: 'neutral' });</script>
</body>
</html>
